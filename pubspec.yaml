name: abdalsalam
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  equatable: ^2.0.7
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  abdalsalam_logic_flutter: ^0.1.0
  adhan: ^2.0.0+1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  encrypt: ^5.0.3
  google_sign_in: ^5.4.4
  googleapis: ^13.2.0
  http: ^1.2.0
  fl_chart: ^0.68.0
  flutter_colorpicker: ^1.1.0
  path_provider: ^2.1.4
  file_picker: ^8.0.0+1
  pdf: ^3.11.1
  printing: ^5.12.0
  sqflite_common_ffi_web: ^1.1.2
  sqflite: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  shared_preferences: ^2.2.3
  sqflite_common_ffi: ^2.3.0

dependency_overrides:
  google_sign_in_ios: 5.8.1
  # TEMPORARY: pin to the local checkout until the web-path fix in
  # sqlite_storage.dart is published as a new abdalsalam_logic_flutter
  # version — remove this override once that version is released.
  abdalsalam_logic_flutter:
    path: ../abdalsalam_logic_flutter

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/data/athkar_content.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
