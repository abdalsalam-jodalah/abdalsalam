<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="abdalsalam">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>abdalsalam</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F1226">
  <style>
    html, body { margin: 0; height: 100%; background: #0F1226; }
    #launch-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F1226;
      transition: opacity 300ms ease-out;
    }
    #launch-screen.is-hidden { opacity: 0; pointer-events: none; }
    #launch-screen img {
      width: 160px;
      height: 160px;
      animation: launch-emblem-in 700ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    @keyframes launch-emblem-in {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="launch-screen"><img src="icons/launch_emblem.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var launchScreen = document.getElementById('launch-screen');
      launchScreen.classList.add('is-hidden');
      setTimeout(function () { launchScreen.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
